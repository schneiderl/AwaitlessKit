name: Package Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:

  test-macos:
    name: Test on Xcode (${{ matrix.name }})
    runs-on: namespace-profile-macos-m4-6cpu-14ram
    strategy:
      matrix:
        include:
          - name: "Xcode 16"
            xcode-version: "16.4"
            upload-coverage: false
    steps:
      - name: Checkout repository
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Setup debug session
        uses: ./.github/actions/setup-debug
        with:
          debug_enabled: ${{ github.event.inputs.debug_enabled }}

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Use Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Cache Swift dependencies
        uses: ./.github/actions/cache-swift-deps
      - name: Generate 5GB random data file
        run: |
          ls -la
          if [ ! -s big_cache.txt ]; then
            echo "big_cache.txt is missing or empty — generating 5GB file"
            dd if=/dev/urandom of=big_cache.txt bs=1M count=5120 status=progress
          else
            echo "big_cache.txt already exists and is non-empty — skipping"
          fi
      - name: Build and Test
        run: REPORT_TESTING=${{ matrix.upload-coverage }} just package-test

      - name: Generate LCOV Coverage Report
        if: ${{ matrix.upload-coverage && !cancelled() }}
        run: just coverage-lcov coverage.lcov

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.upload-coverage && !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov

      - name: Upload test results to Codecov
        if: ${{ matrix.upload-coverage && !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.junit"

      - name: Upload coverage and test artifacts
        if: ${{ matrix.upload-coverage && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-test-reports-${{ matrix.name }}
          path: |
            coverage.lcov
            *.junit
          retention-days: 30
